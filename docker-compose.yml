services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: privacyradar
      POSTGRES_PASSWORD: privacyradar
      POSTGRES_DB: privacyradar
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Current-head reference for first boot. Applications still run `privacyradar migrate`.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privacyradar"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
