name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  gate:
    name: CI passed on main
    if: >
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - run: echo "Deploying ${{ github.event.workflow_run.head_sha }}"

  vercel:
    name: Deploy web to Vercel
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Vercel CLI
        run: npm install -g vercel@54.6.1
      - name: Deploy production on Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          vercel deploy --prod --yes --token "$VERCEL_TOKEN"

  # Railway worker deploys from the GitHub App on main, with Wait for CI
  # enabled so a failed CI check suite skips the worker. Do not also run
  # `railway up` here: GitHub OAuth tokens are not valid Railway API tokens,
  # and a failing job in this workflow would skip the GitHub-triggered deploy.
