name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  worker:
    name: Worker lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: privacyradar
          POSTGRES_PASSWORD: privacyradar
          POSTGRES_DB: privacyradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U privacyradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CI: "true"
      TEST_DATABASE_URL: postgresql://privacyradar:privacyradar@localhost:5432/privacyradar
      TEST_ADMIN_DATABASE_URL: postgresql://privacyradar:privacyradar@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check privacyradar tests
      - run: mypy privacyradar
      - run: pytest

  database-schema:
    name: PostgreSQL schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: privacyradar
          POSTGRES_PASSWORD: privacyradar
          POSTGRES_DB: privacyradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U privacyradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: privacyradar
      DATABASE_URL: postgresql://privacyradar:privacyradar@localhost:5432/privacyradar
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
        working-directory: worker
      - name: Fresh migrate and re-migrate
        run: |
          privacyradar migrate
          privacyradar migrate
      - name: Verify required tables and ledger
        run: |
          test "$(psql -At -h localhost -U privacyradar -d privacyradar -c "select count(*) from information_schema.tables where table_schema = 'public' and table_name in ('companies','policy_sources','snapshots','extractions','change_events','schema_migrations')")" = "6"
          test "$(psql -At -h localhost -U privacyradar -d privacyradar -c "select count(*) from schema_migrations")" = "1"
      - name: Prototype upgrade preserves rows
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U privacyradar -d privacyradar -c "create database upgrade;"
          psql -v ON_ERROR_STOP=1 -h localhost -U privacyradar -d upgrade -f db/schema.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U privacyradar -d upgrade -c "insert into companies (id, slug, name, website) values ('11111111-1111-1111-1111-111111111111', 'prototype', 'Prototype Co', 'https://prototype.example.test');"
          DATABASE_URL=postgresql://privacyradar:privacyradar@localhost:5432/upgrade privacyradar migrate
          DATABASE_URL=postgresql://privacyradar:privacyradar@localhost:5432/upgrade privacyradar migrate
          test "$(psql -At -h localhost -U privacyradar -d upgrade -c "select slug from companies where id = '11111111-1111-1111-1111-111111111111'")" = "prototype"
          test "$(psql -At -h localhost -U privacyradar -d upgrade -c "select version from schema_migrations")" = "0001"

  browser-smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: privacyradar
          POSTGRES_PASSWORD: privacyradar
          POSTGRES_DB: privacyradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U privacyradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://privacyradar:privacyradar@localhost:5432/privacyradar
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
        working-directory: worker
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run test:e2e
        working-directory: web

  pr-secret-guard:
    name: PR secret guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Forbid pull_request_target and secret interpolation
        run: |
          if grep -R "pull_request_target" --include='*.yml' --include='*.yaml' .github/workflows; then
            echo "pull_request_target is forbidden for untrusted PR code" >&2
            exit 1
          fi
          if grep -R "secrets\." --include='*.yml' --include='*.yaml' .github/workflows; then
            echo "workflow files must not interpolate secrets into PR jobs" >&2
            exit 1
          fi

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
