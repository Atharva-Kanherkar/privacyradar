name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  worker:
    name: Worker lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check privacyradar tests
      - run: mypy privacyradar
      - run: pytest

  database-schema:
    name: PostgreSQL schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: privacyradar
          POSTGRES_PASSWORD: privacyradar
          POSTGRES_DB: privacyradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U privacyradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: privacyradar
    steps:
      - uses: actions/checkout@v5
      - name: Apply schema
        run: psql -v ON_ERROR_STOP=1 -h localhost -U privacyradar -d privacyradar -f db/schema.sql
      - name: Reapply schema to verify repeat safety
        run: psql -v ON_ERROR_STOP=1 -h localhost -U privacyradar -d privacyradar -f db/schema.sql
      - name: Verify required tables
        run: |
          test "$(psql -At -h localhost -U privacyradar -d privacyradar -c "select count(*) from information_schema.tables where table_schema = 'public' and table_name in ('companies','policy_sources','snapshots','extractions','change_events')")" = "5"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
