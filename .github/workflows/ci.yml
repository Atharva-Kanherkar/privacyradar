name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          AUTH_SECRET: ci-test-auth-secret-issue-10
          BETTER_AUTH_URL: http://127.0.0.1:3000
      - name: Auth secret must not ship in client bundles
        run: |
          if grep -R -F "ci-test-auth-secret-issue-10" .next/static; then
            echo "AUTH_SECRET leaked into client bundles" >&2
            exit 1
          fi
          if grep -R -F "ci-only-auth-secret-not-for-production" .next/static; then
            echo "auth secret fallback leaked into client bundles" >&2
            exit 1
          fi

  worker:
    name: Worker lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: privacyradar
          POSTGRES_PASSWORD: privacyradar
          POSTGRES_DB: privacyradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U privacyradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CI: "true"
      TEST_DATABASE_URL: postgresql://privacyradar:privacyradar@localhost:5432/privacyradar
      TEST_ADMIN_DATABASE_URL: postgresql://privacyradar:privacyradar@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check privacyradar tests
      - run: mypy privacyradar
      - run: pytest

  database-schema:
    name: PostgreSQL schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: privacyradar
          POSTGRES_PASSWORD: privacyradar
          POSTGRES_DB: privacyradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U privacyradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: privacyradar
      DATABASE_URL: postgresql://privacyradar:privacyradar@localhost:5432/privacyradar
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
        working-directory: worker
      - name: Fresh migrate and re-migrate
        run: |
          privacyradar migrate
          privacyradar migrate
      - name: Verify required tables and ledger
        run: |
          test "$(psql -At -h localhost -U privacyradar -d privacyradar -c "select count(*) from information_schema.tables where table_schema = 'public' and table_name in ('companies','policy_sources','snapshots','extractions','change_events','schema_migrations','source_attempts','observations','document_changes','fetch_jobs','source_operator_actions','taxonomy_versions','extraction_runs','candidate_claims','evidence_spans','publication_revisions','published_claims','review_actions','corrections','product_switches','auth_users','auth_sessions','auth_accounts','auth_verifications','consumer_profiles','consent_events','auth_magic_inbox','watches','product_events')")" = "29"
          test "$(psql -At -h localhost -U privacyradar -d privacyradar -c "select count(*) from schema_migrations")" = "7"
      - name: Prototype upgrade preserves rows
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U privacyradar -d privacyradar -c "create database upgrade;"
          psql -v ON_ERROR_STOP=1 -h localhost -U privacyradar -d upgrade -f db/schema.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U privacyradar -d upgrade -c "insert into companies (id, slug, name, website) values ('11111111-1111-1111-1111-111111111111', 'prototype', 'Prototype Co', 'https://prototype.example.test');"
          DATABASE_URL=postgresql://privacyradar:privacyradar@localhost:5432/upgrade privacyradar migrate
          DATABASE_URL=postgresql://privacyradar:privacyradar@localhost:5432/upgrade privacyradar migrate
          test "$(psql -At -h localhost -U privacyradar -d upgrade -c "select slug from companies where id = '11111111-1111-1111-1111-111111111111'")" = "prototype"
          test "$(psql -At -h localhost -U privacyradar -d upgrade -c "select count(*) from schema_migrations")" = "7"
          test "$(psql -At -h localhost -U privacyradar -d upgrade -c "select count(*) from taxonomy_versions")" = "1"
      - name: 0001-only database upgrades and backfills
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U privacyradar -d privacyradar -c "create database from0001;"
          psql -v ON_ERROR_STOP=1 -h localhost -U privacyradar -d from0001 -f db/migrations/0001_initial.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U privacyradar -d from0001 -c "insert into companies (id, slug, name, website) values ('aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', 'legacy', 'Legacy Co', 'https://legacy.example.test');"
          psql -v ON_ERROR_STOP=1 -h localhost -U privacyradar -d from0001 -c "insert into policy_sources (id, company_id, url) values ('bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb', 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', 'https://legacy.example.test/privacy');"
          psql -v ON_ERROR_STOP=1 -h localhost -U privacyradar -d from0001 -c "insert into snapshots (id, source_id, http_status, markdown, doc_hash) values ('cccccccc-cccc-cccc-cccc-cccccccccccc', 'bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb', 200, E'# Privacy\nWe collect your email address to create an account.', 'validhash');"
          DATABASE_URL=postgresql://privacyradar:privacyradar@localhost:5432/from0001 privacyradar migrate
          test "$(psql -At -h localhost -U privacyradar -d from0001 -c "select count(*) from schema_migrations")" = "7"
          test "$(psql -At -h localhost -U privacyradar -d from0001 -c "select count(*) from taxonomy_versions")" = "1"
          test "$(psql -At -h localhost -U privacyradar -d from0001 -c "select count(*) from observations")" = "1"
          test "$(psql -At -h localhost -U privacyradar -d from0001 -c "select current_snapshot_id from policy_sources")" = "cccccccc-cccc-cccc-cccc-cccccccccccc"

  browser-smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: privacyradar
          POSTGRES_PASSWORD: privacyradar
          POSTGRES_DB: privacyradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U privacyradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://privacyradar:privacyradar@localhost:5432/privacyradar
      CI: "true"
      AUTH_SECRET: ci-test-auth-secret-issue-10
      AUTH_DELIVERY: fixture
      BETTER_AUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
        working-directory: worker
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run test:e2e
        working-directory: web

  pr-secret-guard:
    name: PR secret guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Forbid untrusted workflow checkout and secret interpolation
        run: |
          python3 <<'PY'
          from pathlib import Path

          event = "_".join(["pull_request", "target"])
          secret = "secrets" + "."
          failed = False
          for path in Path(".github/workflows").glob("*.yml"):
              text = path.read_text()
              if event in text:
                  print(f"{path}: contains {event}", flush=True)
                  failed = True
              if secret in text:
                  print(f"{path}: interpolates {secret}", flush=True)
                  failed = True
          if failed:
              raise SystemExit(1)
          print("PR workflows do not use untrusted checkout or secret interpolation")
          PY

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
