<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- PrivacyRadar mark: shield with radar sweep -->
  <defs>
    <clipPath id="shield">
      <path d="M256 26 L282 44 C330 74 388 88 448 92 L448 268 C448 366 372 448 256 492 C140 448 64 366 64 268 L64 92 C124 88 182 74 230 44 Z" />
    </clipPath>
  </defs>
  <!-- shield body -->
  <path d="M256 26 L282 44 C330 74 388 88 448 92 L448 268 C448 366 372 448 256 492 C140 448 64 366 64 268 L64 92 C124 88 182 74 230 44 Z" fill="#171E2C" />
  <g clip-path="url(#shield)">
    <!-- radar rings -->
    <circle cx="256" cy="276" r="148" fill="none" stroke="#FFFFFF" stroke-width="24" />
    <path d="M 256 186 A 90 90 0 1 0 346 276" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" />
    <!-- sweep: bright outer wedge, dark inner wedge -->
    <path d="M256 276 L336 29 A260 260 0 0 1 472 131 Z" fill="#29DE8D" />
    <path d="M256 276 L296 152 A130 130 0 0 1 364 203 Z" fill="#1E9E6A" />
    <!-- blip on the sweep -->
    <circle cx="380" cy="148" r="17" fill="none" stroke="#171E2C" stroke-width="9" />
    <!-- center dot -->
    <circle cx="256" cy="276" r="36" fill="#29DE8D" />
  </g>
</svg>
