[project]
name = "privacyradar-worker"
version = "0.1.0"
description = "hash-first privacy-policy crawler and openai extractor for privacyradar"
requires-python = ">=3.12"
dependencies = [
  "arq>=0.26",
  "httpx>=0.28",
  "openai>=1.82",
  "psycopg[binary]>=3.2",
  "pydantic>=2.11",
  "pydantic-settings>=2.9",
  "python-dotenv>=1.1",
  "pyyaml>=6.0",
  "trafilatura>=2.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  "types-PyYAML>=6.0",
]

[project.scripts]
privacyradar = "privacyradar.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["privacyradar*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=privacyradar --cov-report=term-missing --cov-fail-under=75"
testpaths = ["tests"]
markers = [
  "integration: tests that require PostgreSQL or Redis",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["trafilatura"]
ignore_missing_imports = true
